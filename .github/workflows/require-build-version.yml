name: Require dashboard build version

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  require-build-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version bump for runtime changes
        shell: bash
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          runtime='^(app|components|lib|tools|scripts)/|^(middleware\.ts|next\.config\.ts|vercel\.json|package\.json)$'
          if grep -Eq "$runtime" <<< "$changed" && ! grep -Fxq '.buildnumber' <<< "$changed"; then
            echo "Runtime changes must also increment .buildnumber so the dashboard header identifies the deployed release."
            exit 1
          fi
